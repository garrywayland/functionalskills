name: Discover

on:
  workflow_dispatch:
    inputs:
      phase:
        description: official searches Pearson only; unofficial looks at third-party sites
        type: choice
        options: [official, unofficial]
        default: official
      max_turns:
        description: cap on agent turns (controls cost)
        default: "25"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PHASE: ${{ inputs.phase }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: python discover.py --phase "$PHASE" --max-turns "$MAX_TURNS"
      - name: Save candidates to the repo
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          if [ -f candidates.json ]; then git add candidates.json; fi
          git diff --cached --quiet || git commit -m "Candidates from discovery agent"
          git push
      - name: Job summary
        if: always()
        run: python summary.py candidates >> "$GITHUB_STEP_SUMMARY"
