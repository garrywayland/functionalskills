name: Approve

on:
  workflow_dispatch:
    inputs:
      ids:
        description: candidate ids, comma separated, or all
        required: true
      phase:
        type: choice
        options: [official, unofficial]
        default: official
      download:
        description: unofficial only - allow download (read the licence note first)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Approve
        env:
          IDS: ${{ inputs.ids }}
          PHASE: ${{ inputs.phase }}
          DOWNLOAD: ${{ inputs.download }}
        run: |
          EXTRA=""
          if [ "$DOWNLOAD" = "true" ]; then EXTRA="--download"; fi
          python approve.py --phase "$PHASE" --ids "$IDS" $EXTRA
      - name: Save manifest to the repo
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add manifest.json candidates.json
          git diff --cached --quiet || git commit -m "Approve candidates"
          git push
